<!-- Here we have a collection of scenarios to show different set of actions according to the current status.
     Note: the global/mode-level actions below (Enable/Disable Editing, Undo/Redo, Upload, Reload, Toggle Theme,
     Insert Compartment, Align Centers, Unlock) are also available from the persistent app-diagram-toolbar. Both
     access points are kept so users can act either via right-click or via the toolbar.
     Actions that are currently unavailable are omitted rather than shown disabled, since this menu is rebuilt
     fresh on every right-click. -->
<div class="actions">
  <!-- Editing mode toggle -->
  <button (click)="onClick('disableEditing')" *ngIf="isDiagramEditing">Disable Editing</button>
  <button (click)="onClick('enableEditing')" *ngIf="!isDiagramEditing && !isLockAcquiring">Enable Editing</button>

  <!--TODO: We may switch to check all objects related to object specific reaction -->
  <ng-container *ngIf="elmType === elmTypes.EDGE">
    <ng-container *ngIf="isEdgeEditable">
      <button (click)="onClick('addPoint')">Add Edge Point</button>
      <!-- Only a reaction can be deleted from the diagram -->
      <button (click)="onClick('delete')">Remove Reaction</button>
      <button (click)="onClick('disableEdgeEditing')">Disable Edge Editing</button>
    </ng-container>
    <button (click)="onClick('enableEdgeEditing')" *ngIf="!isEdgeEditable">Enable Edge Editing</button>
  </ng-container>

  <!-- Add a flowline between a PE and a ProcessNode -->
  <button (click)="onClick('addFlowLine')"
    *ngIf="(elmType === elmTypes.PE_Node || elmType === elmTypes.PATHWAY_NODE || elmType === elmTypes.CYTOSCAPE) && isFlowLineAddable">Add
    Flow Line</button>

  <!-- Remove a flowline between a PE and a ProcessNode -->
  <ng-container *ngIf="elmType === elmTypes.FLOWLINE && isDiagramEditing">
    <button (click)="onClick('addPoint')">Add Edge Point</button>
    <button (click)="onClick('delete')">Remove Flow Line</button>
  </ng-container>

  <!-- The following actions are for editing only -->
  <ng-container *ngIf="isDiagramEditing">
    <button (click)="onClick('undo')" *ngIf="canUndo">Undo</button>
    <button (click)="onClick('redo')" *ngIf="canRedo">Redo</button>

    <ng-container *ngIf="isNodeResizable">
      <button (click)="onClick('resizeCompartment')" *ngIf="!isNodeResizing">Resize</button>
      <button (click)="onClick('disableResize')" *ngIf="isNodeResizing">Disable Resizing</button>
    </ng-container>

    <!-- A PE node with no edges connected to it is safe to remove directly -->
    <button (click)="onClick('deleteNode')"
      *ngIf="elmType === elmTypes.PE_Node && isNodeDeletable">Delete Node</button>

    <!-- The compartment can be added or removed directly -->
    <button (click)="onClick('deleteCompartment')" *ngIf="elmType === elmTypes.COMPARTMENT">Delete
      Compartment</button>
    <button (click)="onClick('insertCompartment')" *ngIf="elmType === elmTypes.CYTOSCAPE">Insert Compartment</button>

    <!-- Actions for multiple selected nodes -->
    <ng-container *ngIf="elmType === elmTypes.MULTIPLE_NODES">
      <button (click)="onClick('alignCentersVertically')">Align Centers Vertically</button>
      <button (click)="onClick('alignCentersHorizontally')">Align Centers Horizontally</button>
    </ng-container>
  </ng-container>

  <button (click)="onClick('removePoint')" *ngIf="elmType === elmTypes.EDGE_POINT">Remove Edge Point</button>

  <ng-container *ngIf="elmType === elmTypes.PATHWAY_NODE">
    <button (click)="onClick('deletePathway')" *ngIf="isPathwayDeletable">Delete Pathway</button>
    <button (click)="onClick('goToPathway')">Go to Pathway</button>
  </ng-container>

  <!-- Diagram can be uploaded at either editing or non-editing modes in case the user disables editing after a
       change or they'd like to reload to see others' changes -->
  <button (click)="onClick('upload')" *ngIf="isDiagramEdited">Upload Diagram</button>
  <button (click)="onClick('reload')">Reload Pathway Diagram</button>
</div>
