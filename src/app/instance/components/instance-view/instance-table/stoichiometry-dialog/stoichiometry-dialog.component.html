<h2 class="dialog_title" mat-dialog-title>Set Stoichiometry</h2>
<mat-dialog-content>
  <p class="target-name">{{ data.displayName }}</p>
  <mat-form-field class="count-field" appearance="fill">
    <mat-label>Number of copies</mat-label>
    <input matInput type="number" min="1" step="1" [(ngModel)]="count"
      (keydown.enter)="onOK()" cdkFocusInitial>
    <mat-hint>Currently {{ data.currentCount }}.</mat-hint>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onOK()"><mat-icon>check</mat-icon>OK</button>
  <button mat-button (click)="onCancel()"><mat-icon>close</mat-icon>Cancel</button>
</mat-dialog-actions>
