<h2 class="dialog_title" mat-dialog-title cdkdraghandle> QA Report for "{{qaReport!.instance.displayName}}"</h2>
<mat-dialog-content style="width: 100%">
  <ng-container *ngFor="let check of qaReport!.qaResults">
    <h4 style="display: flex;" class="check-title">{{check.checkName}}: 
      <ng-container *ngIf="check.passed">
        <p style="color: green; white-space: pre;"> Passed</p>
      </ng-container>
    </h4>

    <ng-container *ngIf="!check.passed">
      <p *ngIf="check.issue" class="check-issue">{{check.issue}}</p>
      <!-- A Pathway's reaction imbalance check can run to thousands of rows, so it is grouped by reaction. -->
      <reaction-imbalance-table *ngIf="isPathwayReactionImbalance(check); else flatTable"
        [columns]="check.columns!" [rows]="check.rows ?? []" [eventDbId]="qaReport!.instance.dbId"></reaction-imbalance-table>
      <ng-template #flatTable>
        <qa-report-table *ngIf="check.rows?.length" [rows]="check.rows!"
          [colNames]="check.columns ? check.columns : []"></qa-report-table>
      </ng-template>
    </ng-container>
    <!-- <br> -->
  </ng-container>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button color="warn" *ngIf="!qaReportPassed && data.report" (click)="onAutoFix()">Auto-Fix</button>
  <button mat-button (click)="onCancel()">Close</button>
</mat-dialog-actions>
