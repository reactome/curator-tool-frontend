<h2 mat-dialog-title>Restore Staged-Changes Backup</h2>

<mat-dialog-content>
  <div class="loading-row" *ngIf="loading">
    <mat-spinner diameter="24"></mat-spinner>
    <span>Loading backups...</span>
  </div>

  <p *ngIf="!loading && backups.length === 0">No backups are available yet.</p>

  <table mat-table [dataSource]="backups" *ngIf="!loading && backups.length > 0"
    class="backups-table mat-elevation-z0">

    <ng-container matColumnDef="timestamp">
      <th mat-header-cell *matHeaderCellDef>Backed Up At</th>
      <td mat-cell *matCellDef="let row">{{ formatTimestamp(row.lastModified) }}</td>
    </ng-container>

    <ng-container matColumnDef="restore">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row" class="restore-cell">
        <button mat-button color="primary" [disabled]="restoringFileName === row.fileName"
          (click)="restore(row)">
          {{ restoringFileName === row.fileName ? 'Restoring...' : 'Restore' }}
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onClose()">Close</button>
</mat-dialog-actions>
