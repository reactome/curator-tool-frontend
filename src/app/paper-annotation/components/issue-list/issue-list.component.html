<div class="issue-list">
  <div class="filters" *ngIf="notes || done">
    <mat-checkbox *ngIf="notes" [(ngModel)]="showNotes">Notes ({{ notes }})</mat-checkbox>
    <mat-checkbox *ngIf="done" [(ngModel)]="showDone">Resolved or dismissed ({{ done }})</mat-checkbox>
  </div>
  <div class="error" *ngIf="error" role="alert"><mat-icon>error_outline</mat-icon> {{ error }}</div>
  <p class="empty" *ngIf="!listed.length && empty">{{ empty }}</p>
  <ul class="issues">
    <li *ngFor="let i of listed" [class.done]="i.status !== 'open'" [class.waiting]="i.blocked_by && i.status === 'open'">
      <div class="row">
        <mat-icon [ngClass]="'sev-' + i.severity" [attr.aria-label]="i.severity">{{ icon(i) }}</mat-icon>
        <div class="text">
          <div class="message">{{ i.message }}</div>
          <div class="meta">
            <span>{{ categoryLabel(i) }}</span>
            <span>· {{ i.source }}</span>
            <span *ngIf="i.blocked_by" class="wait">· matters only if you keep the reaction</span>
            <span *ngIf="i.status !== 'open'">· {{ i.status }}</span>
          </div>
        </div>
        <div class="actions">
          <ng-container *ngIf="i.status === 'open'; else reopen">
            <button mat-button [disabled]="busy.has(i.id)" (click)="setStatus(i, 'resolved')">Resolve</button>
            <button mat-button [disabled]="busy.has(i.id)" (click)="setStatus(i, 'dismissed')">Dismiss</button>
          </ng-container>
          <ng-template #reopen>
            <button mat-button [disabled]="busy.has(i.id)" (click)="setStatus(i, 'open')">Reopen</button>
          </ng-template>
        </div>
      </div>
      <div class="fix" *ngIf="i.status === 'open' && fixOf(i) as p">
        <span class="fix-label"><mat-icon inline>build</mat-icon> Suggested fix</span>
        <app-proposal-card [sessionId]="sessionId" [proposal]="p" (decided)="onDecided($event)"></app-proposal-card>
      </div>
    </li>
  </ul>
</div>
