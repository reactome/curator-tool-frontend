<div class="condition-builder">
  <div class="condition-fields">
    <mat-form-field class="field-attribute" subscriptSizing="dynamic">
      <mat-label>Attribute</mat-label>
      <mat-select class="text-sm" [(value)]="attributeCondition.attributeName">
        @for (attribute of schemaAttributes; track attribute) {
        <mat-option class="text-sm" [value]="attribute">{{attribute}}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field class="field-operand" subscriptSizing="dynamic">
      <mat-label>Operand</mat-label>
      <mat-select class="text-sm" [(value)]="attributeCondition.operand">
        @for (operand of operands; track operand) {
        <mat-option class="text-sm" [value]="operand">{{operand}}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field class="field-term" subscriptSizing="dynamic" *ngIf="!isNullOperand()">
      <mat-label>{{ isRegexOperand() ? 'Regular expression' : 'Search term' }}</mat-label>
      <input [(ngModel)]="attributeCondition.searchKey" id="searchKey" (keydown)="onKeyDown($event)"
        class="text-sm" matInput #input
        [placeholder]="isRegexOperand() ? 'e.g. ^Cyclin.*[AB]$' : 'Enter a value'">
      <mat-icon matSuffix class="regex-help-icon" *ngIf="isRegexOperand()"
        [matTooltip]="regexTooltip" matTooltipPosition="above"
        aria-label="How regular expressions are matched">help_outline</mat-icon>
      <mat-hint class="text-sm regex-error" *ngIf="regexError()">{{ regexError() }}</mat-hint>
    </mat-form-field>
  </div>

  <div class="condition-actions">
    <button mat-stroked-button color="primary" type="button" class="text-sm"
      [disabled]="!canAddCondition()"
      matTooltip="Add this condition to the list (Enter)" (click)="addNewCriterium()">
      <mat-icon>add</mat-icon>
      Add condition
    </button>
    <button mat-flat-button color="primary" type="button" class="text-sm"
      matTooltip="Run the search using all conditions (Ctrl+Enter)" (click)="completeQuery()">
      <mat-icon>search</mat-icon>
      Search
    </button>
  </div>
</div>
