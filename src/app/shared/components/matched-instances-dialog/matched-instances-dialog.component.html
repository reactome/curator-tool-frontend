<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
    <p>
        The following new instance(s) matched existing instance(s) in the database and were
        <strong>not committed</strong>. Please review the matches below.
    </p>

    <div class="match-group" *ngFor="let group of data.groups">
        <h3 class="match-group-title">{{ group.newInstance.displayName }}</h3>

        <table mat-table [dataSource]="group.matches" class="matched-instances-table mat-elevation-z0">

            <ng-container matColumnDef="dbId">
                <th mat-header-cell *matHeaderCellDef>dbId</th>
                <td mat-cell *matCellDef="let row">{{ row.dbId }}</td>
            </ng-container>

            <ng-container matColumnDef="displayName">
                <th mat-header-cell *matHeaderCellDef>Display Name</th>
                <td mat-cell *matCellDef="let row">{{ row.displayName }}</td>
            </ng-container>

            <ng-container matColumnDef="launch">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let row" class="launch-cell">
                    <button class="mini-btn" color="primary" mat-icon-button (click)="openInstance(row.dbId)"
                        matTooltip="Open instance">
                        <mat-icon>open_in_new</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onClose()">Close</button>
</mat-dialog-actions>
