<h2 mat-dialog-title>Are you still there?</h2>
<mat-dialog-content>
  <p>You have been inactive for a while. For your security you will be logged out in
    <strong>{{ remainingSeconds }}</strong> second{{ remainingSeconds === 1 ? '' : 's' }}.</p>
  <p>Any unsaved changes will be saved before you are logged out.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="logoutNow()">Log out now</button>
  <button mat-raised-button color="primary" (click)="stayLoggedIn()">Stay logged in</button>
</mat-dialog-actions>
