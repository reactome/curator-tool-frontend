<h2 mat-dialog-title>{{data.title}}</h2>
<mat-dialog-content>
  <p *ngIf="data.message">{{data.message}}</p>
  <mat-form-field appearance="fill" class="file-name-field">
    <mat-label>File name</mat-label>
    <input matInput [(ngModel)]="fileName" (keyup.enter)="submit()" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions class="actions-right" align="end">
  <button mat-button [mat-dialog-close]="null">Cancel</button>
  <button mat-button color="primary" (click)="submit()" [disabled]="!fileName.trim()">Export</button>
</mat-dialog-actions>
