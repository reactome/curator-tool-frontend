<div class="settings">
    <h4>Predicted pathways</h4>
    <div class="fields">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Functional Interaction Score &gt;</mat-label>
            <input [(ngModel)]="configuration.fi_cutoff" matInput min="0" max="0.99" step="0.05" type="number"
                matTooltip="Partners with a lower functional interaction score are not used">
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Top Partners</mat-label>
            <input [(ngModel)]="configuration.top_partners" matInput min="1" max="50" step="1" type="number"
                matTooltip="How many partners, best functional interaction score first, the enrichment is run over">
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>FDR &lt;</mat-label>
            <mat-select [(ngModel)]="configuration.fdr_cutoff" matTooltip="Only pathways enriched below this FDR are predicted">
                <mat-option *ngFor="let fdr of fdrOptions" [value]="fdr">{{ fdr }}</mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Top Pathways</mat-label>
            <input [(ngModel)]="configuration.max_pathways" matInput min="1" max="50" step="1" type="number"
                matTooltip="How many predicted pathways are listed, lowest FDR first">
        </mat-form-field>
    </div>

    <div class="actions">
        <button (click)="resetValues()" mat-button type="button" class="reset-button">
            <mat-icon>refresh</mat-icon> Reset
        </button>
    </div>
</div>
